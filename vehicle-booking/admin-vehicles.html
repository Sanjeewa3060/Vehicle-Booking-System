<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Vehicles - VehicleBook Admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="first.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- Sidebar (same as admin-dashboard) -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <svg
            class="sidebar-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path
              d="M5 17h14v-5H5v5zm7-12a4 4 0 0 1 4 4v1H8V9a4 4 0 0 1 4-4z"
            />
          </svg>
          <span>VehicleBook Admin</span>
        </div>

        <nav class="sidebar-nav">
          <a href="admin-dashboard.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
            </svg>
            <span>Dashboard</span>
          </a>
          <a href="admin-vehicles.html" class="sidebar-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path
                d="M5 17h14v-5H5v5zm7-12a4 4 0 0 1 4 4v1H8V9a4 4 0 0 1 4-4z"
              />
            </svg>
            <span>Vehicles</span>
          </a>
          <a href="admin-bookings.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <span>Bookings</span>
          </a>
          <a href="admin-users.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
            </svg>
            <span>Users</span>
          </a>
          <a href="#" class="sidebar-link" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Logout</span>
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>

        <div class="content-wrapper">
          <div class="flex-between mb-20">
            <h1 class="page-title" style="margin-bottom: 0">Manage Vehicles</h1>
            <button class="btn btn-primary" onclick="showAddModal()">
              <svg
                style="
                  width: 20px;
                  height: 20px;
                  display: inline;
                  vertical-align: middle;
                  margin-right: 8px;
                "
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Add Vehicle
            </button>
          </div>

          <div class="table-container">
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Vehicle Name</th>
                    <th>Type</th>
                    <th>Price/Day</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="vehiclesTableBody">
                  <tr>
                    <td colspan="5" class="text-center">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal -->
    <div id="vehicleModal" class="modal-overlay hidden">
      <div class="modal">
        <h2 class="modal-header" id="modalTitle">Add Vehicle</h2>
        <form id="vehicleForm" class="modal-form">
          <div class="form-group">
            <label>Vehicle Name</label>
            <input type="text" id="vehicleName" name="name" required />
          </div>

          <div class="form-group">
            <label>Type</label>
            <input
              type="text"
              id="vehicleType"
              name="type"
              placeholder="e.g., SUV, Sedan, Electric"
              required
            />
          </div>

          <div class="form-group">
            <label>Price per Day ($)</label>
            <input
              type="number"
              id="vehiclePrice"
              name="price"
              step="0.01"
              required
            />
          </div>

          <div class="form-group">
            <label>Status</label>
            <select id="vehicleStatus" name="status" required>
              <option value="Available">Available</option>
              <option value="Unavailable">Unavailable</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="submit" class="btn btn-primary" style="flex: 1">
              Save
            </button>
            <button
              type="button"
              class="btn"
              style="flex: 1; background: #6c757d; color: white"
              onclick="closeModal()"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/admin-vehicles.js"></script>
  </body>
</html>
