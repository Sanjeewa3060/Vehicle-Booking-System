<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - VehicleBook</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="first.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <svg
            class="sidebar-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path
              d="M5 17h14v-5H5v5zm7-12a4 4 0 0 1 4 4v1H8V9a4 4 0 0 1 4-4z"
            />
          </svg>
          <span>VehicleBook Admin</span>
        </div>

        <nav class="sidebar-nav">
          <a href="admin-dashboard.html" class="sidebar-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
            </svg>
            <span>Dashboard</span>
          </a>
          <a href="admin-vehicles.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path
                d="M5 17h14v-5H5v5zm7-12a4 4 0 0 1 4 4v1H8V9a4 4 0 0 1 4-4z"
              />
            </svg>
            <span>Vehicles</span>
          </a>
          <a href="admin-bookings.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <span>Bookings</span>
          </a>
          <a href="admin-users.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span>Users</span>
          </a>
          <a href="#" class="sidebar-link" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Logout</span>
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>

        <div class="content-wrapper">
          <h1 class="page-title">Admin Dashboard</h1>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-content">
                <p class="stat-label">Total Vehicles</p>
                <p class="stat-value" id="totalVehicles">0</p>
              </div>
              <svg
                class="stat-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M5 17h14v-5H5v5zm7-12a4 4 0 0 1 4 4v1H8V9a4 4 0 0 1 4-4z"
                />
              </svg>
            </div>

            <div class="stat-card stat-card-accent">
              <div class="stat-content">
                <p class="stat-label">Total Bookings</p>
                <p class="stat-value" id="totalBookings">0</p>
              </div>
              <svg
                class="stat-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
            </div>

            <div class="stat-card">
              <div class="stat-content">
                <p class="stat-label">Total Users</p>
                <p class="stat-value" id="totalUsers">0</p>
              </div>
              <svg
                class="stat-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
              </svg>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/admin-dashboard.js"></script>
  </body>
</html>
